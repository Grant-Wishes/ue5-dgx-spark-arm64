# A screen on the DGX Spark's GB10 with no monitor attached, for an X server started by a normal user (26 Nov).
# UseDisplayDevice "None" makes the NVIDIA driver run with NoScanout: it then needs no modesetting permission, which a
# non-root X server is refused ("Failed to acquire modesetting permission" with the stock xorg.conf).
Section "ServerLayout"
    Identifier "Layout0"
    Screen 0 "Screen0"
EndSection
Section "ServerFlags"
    Option "AutoAddDevices" "false"
    Option "AutoAddGPU" "false"
EndSection
Section "Device"
    Identifier "Device0"
    Driver "nvidia"
    Option "UseDisplayDevice" "None"
    Option "AllowEmptyInitialConfiguration" "True"
EndSection
Section "Screen"
    Identifier "Screen0"
    Device "Device0"
    DefaultDepth 24
    SubSection "Display"
        Depth 24
        Virtual 1920 1080
    EndSubSection
EndSection
